<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ thống Nội bộ - Đăng nhập</title>
    <!-- Liên kết file CSS -->
    <link rel="stylesheet" href="dangnhap.css">
</head>
<body>

    <!-- Thanh điều hướng phía trên -->
    <div class="navbar">
        <div class="nav-container"> <!-- Thẻ div giúp gom menu lại đúng độ rộng 1000px -->
            <div class="nav-brand">POS Nhà Hàng</div>
            <div class="nav-links">
                <a href="#">Trang chủ</a>
                <a href="#">Thực đơn</a>
                <a href="#">Ca làm việc</a>
            </div>
        </div>
    </div>

    <!-- Khung chính chứa 2 phần: Giới thiệu và Form đăng nhập -->
    <div class="main-container">
        
        <!-- Cột bên trái: Nội dung giới thiệu -->
        <div class="left-box">
            <h2>Nhà hàng HTD</h2>
            <p>Hệ thống nội bộ phục vụ nhân viên order, thanh toán và quản lý ca trực tại nhà hàng.</p>
        </div>

        <!-- Cột bên phải: Form đăng nhập -->
        <div class="right-box">
            <div class="login-card">
                <h2>Đăng Nhập</h2>
                <p>Hệ thống quản trị nội bộ nhân viên</p>

                <!-- Đồng hồ thời gian -->
                <div id="realTimeClock">--:--:--</div>

                <!-- Thông báo lỗi (mặc định ẩn) -->
                <div id="errorMsg" style="display: none;">
                    Mã nhân viên hoặc mật khẩu không chính xác!
                </div>

                <!-- Biểu mẫu đăng nhập -->
                <form id="loginForm">
                    <div class="form-group">
                        <label>Mã nhân viên (ID):</label>
                        <input type="text" id="empId" placeholder="Ví dụ: NV0123" required>
                    </div>

                    <div class="form-group">
                        <label>Mật khẩu (PIN):</label>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                        <button type="button" id="toggleBtn">Hiện mật khẩu</button>
                    </div>

                    <button type="submit" id="submitBtn">VÀO CA LÀM VIỆC</button>
                </form>
            </div>
        </div>

    </div>

    <!-- JavaScript cơ bản thuần túy -->
    <script>
        // 1. Hàm hiển thị đồng hồ thời gian thực
        function updateClock() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            var day = now.getDate();
            var month = now.getMonth() + 1;
            var year = now.getFullYear();

            if (hours < 10) { hours = "0" + hours; }
            if (minutes < 10) { minutes = "0" + minutes; }
            if (seconds < 10) { seconds = "0" + seconds; }
            if (day < 10) { day = "0" + day; }
            if (month < 10) { month = "0" + month; }

            var timeString = hours + ":" + minutes + ":" + seconds + " - " + day + "/" + month + "/" + year;
            document.getElementById("realTimeClock").innerText = timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // 2. Chức năng ẩn / hiện mật khẩu
        var toggleBtn = document.getElementById("toggleBtn");
        var passwordInput = document.getElementById("password");

        toggleBtn.onclick = function() {
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleBtn.innerText = "Ẩn mật khẩu";
            } else {
                passwordInput.type = "password";
                toggleBtn.innerText = "Hiện mật khẩu";
            }
        };

        // 3. Xử lý khi bấm nút đăng nhập
        var loginForm = document.getElementById("loginForm");
        var errorMsg = document.getElementById("errorMsg");
        var submitBtn = document.getElementById("submitBtn");

        loginForm.onsubmit = function(event) {
            event.preventDefault();

            var empId = document.getElementById("empId").value;
            var password = passwordInput.value;

            errorMsg.style.display = "none";
            submitBtn.innerText = "ĐANG XÁC THỰC...";
            submitBtn.disabled = true;

            setTimeout(function() {
                if (empId.toUpperCase() === "ADMIN" && password === "123456") {
                    submitBtn.innerText = "ĐĂNG NHẬP THÀNH CÔNG";
                    submitBtn.style.backgroundColor = "green";
                } else {
                    errorMsg.style.display = "block";
                    submitBtn.innerText = "VÀO CA LÀM VIỆC";
                    submitBtn.disabled = false;
                    passwordInput.value = "";
                    passwordInput.focus();
                }
            }, 1000);
        };
    </script>
</body>
</html>
